# ─────────────────────────────────────────────────────────────────────────────
# Jiezi Cloud — Test overrides
#
# Applied when JIEZI__ENVIRONMENT=test (used by integration tests).
# In-memory SQLite keeps tests fast and fully isolated.
# ─────────────────────────────────────────────────────────────────────────────

environment = "test"

[database]
url             = "sqlite::memory:"
max_connections = 1
min_connections = 1

[tracing]
level  = "warn"
format = "compact"
