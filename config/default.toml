# ─────────────────────────────────────────────────────────────────────────────
# Jiezi Cloud — Default configuration
#
# This file contains base values for ALL environments.  It is committed to git
# and must never contain secrets.
#
# Override precedence (highest wins):
#   environment variables (JIEZI__SECTION__KEY)
#   config/local.toml          ← machine-local, git-ignored
#   config/{environment}.toml  ← development.toml / production.toml
#   config/default.toml        ← this file
# ─────────────────────────────────────────────────────────────────────────────

environment = "development"

# ── HTTP server ───────────────────────────────────────────────────────────────
[server]
host    = "127.0.0.1"
port    = 8080
workers = 0            # 0 = use available_parallelism (one thread per CPU core)

# ── Database ──────────────────────────────────────────────────────────────────
[database]
url                     = "sqlite:./data/jiezi-dev.db?mode=rwc"
max_connections         = 5
min_connections         = 1
connect_timeout_seconds = 30

# ── Authentication ────────────────────────────────────────────────────────────
[auth]
# WARNING: change this via JIEZI__AUTH__JWT_SECRET in production.
# The server will refuse to start if this placeholder is used in production.
jwt_secret                = "CHANGE_ME_IN_PRODUCTION_USE_A_LONG_RANDOM_STRING"
access_token_ttl_seconds  = 900       # 15 minutes
refresh_token_ttl_seconds = 2592000   # 30 days

[database.backup]
enabled          = true
interval_minutes = 15
keep_count       = 48        # 12 hours at 15-min intervals (48 x 15 min)
dir              = "./data/backups/db"

# ── File storage ──────────────────────────────────────────────────────────────
[storage]
local_root        = "./data/files"
max_upload_bytes  = 10737418240   # 10 GiB

# Files >= this byte count are transferred via QUIC (lower latency for large files).
# Files below this threshold use HTTP/2 multipart upload.
# Default: 20 MiB = 20 * 1024 * 1024.
large_file_threshold_bytes = 20971520

# ── Tracing / logging ─────────────────────────────────────────────────────────
[tracing]
level  = "debug"
format = "pretty"   # pretty | json | compact

# ── Security ──────────────────────────────────────────────────────────────────
[security]
# Lock an account after this many consecutive failed logins.
# 0 = disabled (not recommended for internet-facing deployments).
max_login_attempts        = 5

# How long (in seconds) to keep the account locked.  900 = 15 minutes.
lockout_duration_secs     = 900

# Maximum auth-endpoint (login / register / refresh) requests per IP per minute.
auth_rate_limit_per_minute = 20

# Allowed CORS origins.  Empty list = allow all origins (OK for local dev only).
# Example: cors_allowed_origins = ["https://cloud.example.com"]
cors_allowed_origins      = []

# Maximum password byte length accepted before Argon2 hashing.
# Prevents CPU-exhaustion attacks via absurdly long passwords.
max_password_bytes        = 128

# ── Email (SMTP) ───────────────────────────────────────────────────
[email]
# Set to true to actually connect to SMTP and send emails.
# Leave false (default) for development: tokens are logged at INFO level.
enabled              = false

smtp_host            = "smtp.example.com"
smtp_port            = 587
smtp_username        = ""
smtp_password        = ""
from_address         = "no-reply@example.com"
from_name            = "Jiezi Cloud"

# If true, users MUST supply the email OTP during registration.
verification_required = false

# How long each OTP remains valid (seconds).  600 = 10 minutes.
otp_ttl_secs         = 600
