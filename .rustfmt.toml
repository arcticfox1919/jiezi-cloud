# Rustfmt configuration for Jiezi Cloud
# https://rust-lang.github.io/rustfmt/
#
# Only stable options are used here so that `cargo fmt` works with stable Rust.
# Nightly-only options (imports_granularity, group_imports, brace_style, etc.)
# are intentionally excluded to avoid CI failures on the stable toolchain.

edition = "2024"

# ── Indentation & line width ──────────────────────────────────────────────────
tab_spaces           = 4
max_width            = 100
use_small_heuristics = "Max"

# ── Imports ───────────────────────────────────────────────────────────────────
reorder_imports = true
reorder_modules = true
