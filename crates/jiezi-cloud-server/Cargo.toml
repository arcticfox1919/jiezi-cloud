[package]
name    = "jiezi-cloud-server"
version = "0.1.0"
edition = "2024"
description = "Main server binary: Actix-web HTTP API, WebSocket and QUIC file transfer"

[[bin]]
name = "jiezi-cloud-server"
path = "src/main.rs"

# ─── Database backend feature flags ──────────────────────────────────────────
# Controls which DB driver is compiled into the server binary.
# Build commands:
#   SQLite  (dev):    cargo build                                       (default)
#   PostgreSQL (prod): cargo build --no-default-features --features db-postgres
#   MySQL      (prod): cargo build --no-default-features --features db-mysql
[features]
default     = ["db-sqlite"]
db-sqlite   = ["jiezi-cloud-auth/db-sqlite",   "jiezi-cloud-vfs/db-sqlite",   "jiezi-cloud-migration/db-sqlite"]
db-postgres = ["jiezi-cloud-auth/db-postgres", "jiezi-cloud-vfs/db-postgres", "jiezi-cloud-migration/db-postgres"]
db-mysql    = ["jiezi-cloud-auth/db-mysql",    "jiezi-cloud-vfs/db-mysql",    "jiezi-cloud-migration/db-mysql"]

[dependencies]
jiezi-cloud-core.workspace      = true
jiezi-cloud-config.workspace    = true
jiezi-cloud-auth.workspace      = true
jiezi-cloud-storage.workspace   = true
jiezi-cloud-vfs.workspace       = true
jiezi-cloud-integrity.workspace = true
jiezi-cloud-search.workspace    = true
jiezi-cloud-preview.workspace   = true
jiezi-cloud-share.workspace     = true
jiezi-cloud-ai.workspace        = true
jiezi-cloud-sync.workspace      = true
jiezi-cloud-migration.workspace = true
sea-orm.workspace               = true
sea-orm-migration.workspace     = true
actix-web.workspace             = true
actix-rt.workspace              = true
tracing-actix-web.workspace     = true
utoipa.workspace                = true
utoipa-scalar.workspace         = true
config.workspace                = true
serde.workspace                 = true
serde_json.workspace            = true
tokio.workspace                 = true
tokio-stream.workspace          = true
tracing.workspace               = true
tracing-subscriber.workspace    = true
chrono.workspace                = true
anyhow.workspace                = true
