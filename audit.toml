# cargo-audit configuration
# https://github.com/rustsec/rustsec/tree/main/cargo-audit

[advisories]
# RUSTSEC-2023-0071: Marvin Attack timing side-channel in the `rsa` crate.
#
# This advisory has no fixed version available as of 2026-02. The `rsa` crate
# is a transitive dependency pulled in by `sqlx-postgres` for RSA-based
# PostgreSQL authentication (e.g., scram-sha-256-plus with TLS client certs).
#
# Risk assessment: Low for this project because:
#   1. We use password-based authentication (scram-sha-256), not certificate auth.
#   2. The attack requires a local timing oracle against the RSA private key,
#      which is not exposed in our server-side use case.
#
# Track upstream fix: https://github.com/launchbadge/sqlx/issues/3600
ignore = ["RUSTSEC-2023-0071"]
