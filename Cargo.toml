[workspace]
resolver = "2"
members = [
    "crates/jiezi-cloud-core",
    "crates/jiezi-cloud-auth",
    "crates/jiezi-cloud-storage",
    "crates/jiezi-cloud-vfs",
    "crates/jiezi-cloud-search",
    "crates/jiezi-cloud-preview",
    "crates/jiezi-cloud-share",
    "crates/jiezi-cloud-ai",
    "crates/jiezi-cloud-sync",
    "crates/jiezi-cloud-server",
    "crates/jiezi-cloud-migration",
    "crates/jiezi-cloud-config",
    "crates/jiezi-cloud-integrity",
]

# ─────────────────────────────────────────────────────────────────────────────
# Workspace-wide dependency versions.
# Individual crates opt-in via `dep.workspace = true`.
# ─────────────────────────────────────────────────────────────────────────────
[workspace.dependencies]

# ── Async runtime ─────────────────────────────────────────────────────────────
tokio          = { version = "1",    features = ["full"] }

# ── Serialization ─────────────────────────────────────────────────────────────
serde          = { version = "1",    features = ["derive"] }
serde_json     = "1"

# ── IDs & Time ────────────────────────────────────────────────────────────────
uuid           = { version = "1",    features = ["v4", "v7", "serde"] }
chrono         = { version = "0.4",  features = ["serde"] }

# ── Error handling ────────────────────────────────────────────────────────────
thiserror      = "2"
anyhow         = "1"

# ── Observability ─────────────────────────────────────────────────────────────
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter", "json"] }

# ── Async trait support ───────────────────────────────────────────────────────
async-trait    = "0.1"

# ── Byte buffers ──────────────────────────────────────────────────────────────
bytes          = "1"

# ── HTTP server (Actix-web) ───────────────────────────────────────────────────
actix-web      = "4"
actix-rt       = "2"

# ── Database (ORM — DB driver selected via crate-level feature flags) ─────────
# Workspace provides the version + shared features; each crate adds its own
# db-* feature to pull in the correct SQLx driver at compile time.
sea-orm = { version = "1", features = ["macros", "chrono"] }
sea-orm-migration = { version = "1" }

# sqlx is kept for crates that have not yet migrated to SeaORM
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-native-tls",
    "sqlite",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "macros",
] }

# ── Authentication ────────────────────────────────────────────────────────────
argon2         = "0.5"
jsonwebtoken   = "9"
rand           = "0.9"
sha2           = "0.10"

# ── Config ────────────────────────────────────────────────────────────────────
config         = { version = "0.14", features = ["toml"] }
dotenvy        = "0.15"

# ── URL parsing (used by integrity crate to parse MySQL/PostgreSQL URLs) ──────
url            = "2"

# ── Search ────────────────────────────────────────────────────────────────────
tantivy        = "0.22"

# ── Crate inter-dependencies ──────────────────────────────────────────────────
jiezi-cloud-core      = { path = "crates/jiezi-cloud-core" }
jiezi-cloud-config    = { path = "crates/jiezi-cloud-config" }
jiezi-cloud-integrity = { path = "crates/jiezi-cloud-integrity" }
jiezi-cloud-auth      = { path = "crates/jiezi-cloud-auth" }
jiezi-cloud-storage   = { path = "crates/jiezi-cloud-storage" }
jiezi-cloud-vfs       = { path = "crates/jiezi-cloud-vfs" }
jiezi-cloud-search    = { path = "crates/jiezi-cloud-search" }
jiezi-cloud-preview   = { path = "crates/jiezi-cloud-preview" }
jiezi-cloud-share     = { path = "crates/jiezi-cloud-share" }
jiezi-cloud-ai        = { path = "crates/jiezi-cloud-ai" }
jiezi-cloud-sync      = { path = "crates/jiezi-cloud-sync" }
jiezi-cloud-migration = { path = "crates/jiezi-cloud-migration" }

# ── Workspace-wide lints ──────────────────────────────────────────────────────
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic      = { level = "warn", priority = -1 }
# Allow the most verbose pedantic lints that add noise without value
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
